<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LouLouBeautySalon | 極致指尖美學</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        :root {
            --gold: #D4AF37;
            --dark: #2c2c2c;
            --light: #f9f9f9;
        }

        body {
            margin: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            overflow-x: hidden;
        }

        /* Hero Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), 
                        url('https://images.unsplash.com/photo-1632345031435-8727f6897d53?auto=format&fit=crop&q=80&w=1920') center/cover;
            color: white;
            text-align: center;
        }

        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        /* SVG 線條動畫 */
        .svg-line {
            width: 200px;
            margin: 20px auto;
        }
        .path {
            stroke-dasharray: 1000;
            stroke-dashoffset: 1000;
            animation: draw 3s forwards ease-in-out;
        }
        @keyframes draw {
            to { stroke-dashoffset: 0; }
        }

        /* 響應式網格 */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
            padding: 50px 20px;
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            height: 400px;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s;
        }

        .gallery-item:hover img {
            transform: scale(1.1);
        }

        .cta-button {
            background-color: var(--gold);
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            font-weight: bold;
            border-radius: 50px;
            transition: 0.3s;
            display: inline-block;
            margin-top: 30px;
        }

        .cta-button:hover {
            background-color: #b8962d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        @media (max-width: 768px) {
            .hero-content h1 { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <section class="hero">
        <div class="hero-content">
            <h1 class="animate__animated animate__fadeInDown">LouLou Beauty</h1>
            <p class="animate__animated animate__fadeInUp">訂製您的專屬優雅</p>
            
            <svg class="svg-line" viewBox="0 0 200 20">
                <path class="path" d="M0 10 Q 50 0, 100 10 T 200 10" stroke="#D4AF37" stroke-width="2" fill="transparent" />
            </svg>

            <a href="#booking" class="cta-button animate__animated animate__pulse animate__infinite">立即預約專屬時段</a>
        </div>
    </section>

    <section id="works">
        <h2 style="text-align: center; margin-top: 50px; font-family: 'Playfair Display';">本月限定作品</h2>
        <div class="gallery">
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&q=80&w=800" alt="法式美甲">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1607779097040-26e80aa78e66?auto=format&fit=crop&q=80&w=800" alt="奢華鑲鑽">
            </div>
            <div class="gallery-item">
                <img src="https://images.unsplash.com/photo-1519014816548-bf5fe059798b?auto=format&fit=crop&q=80&w=800" alt="日系渲染">
            </div>
        </div>
    </section>

    <footer style="background: var(--dark); color: white; padding: 50px; text-align: center;">
        <h3>體驗精緻，從細節開始</h3>
        <p>地址：台北市信義區高級路 101 號</p>
        <p>LINE 預約：@LouLouBeauty</p>
    </footer>

</body>
</html>
